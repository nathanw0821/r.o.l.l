name = "r-o-l-l"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_modules"]
minify = true

routes = [
  { pattern = "fallout76.wiki", custom_domain = true },
  { pattern = "www.fallout76.wiki", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[placement]
mode = "smart"

# Plain-text vars only: this file is public. Secrets (DISCORD_CLIENT_SECRET, GOOGLE_CLIENT_SECRET,
# NEXTAUTH_SECRET, DATABASE_URL, TURNSTILE_SECRET_KEY, ...) live in `wrangler secret put <NAME>`
# wrangler-config.test.ts fails if one is added here. Preview deploys were turned off on
# 2026-09-22 (no separate secrets wanted); the CI workflow deploys production only.
# Admin is granted by username only; ADMIN_EMAILS would also require a verified email.
[vars]
NEXTAUTH_URL = "https://fallout76.wiki"
ADMIN_USERNAMES = "ezkialez"
ALLOW_PUBLIC_REGISTRATION = "true"
EMAIL_FROM = "R.O.L.L <no-reply@support.fallout76.wiki>"
GOOGLE_CLIENT_ID = "717058834888-tri1suu3o125h1haajjrffufioj75ga7.apps.googleusercontent.com"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADptvziu-B7dS6yh"
DISCORD_CLIENT_ID = "1530017912520445962"
DISCORD_PUBLIC_KEY = "fedb0644caf356455e981c9f7935aaa7cb4e38ecb67a6f80c6476926ce4a0c0a"

# No cron trigger: the OpenNext worker has no scheduled() handler, so the old daily trigger only
# failed. /api/cron/* stay callable with CRON_SECRET; wire a scheduled() entry before re-adding it.
# An explicit empty list makes `wrangler deploy` remove the old trigger (omitting it would keep it).
[triggers]
crons = []

[[kv_namespaces]]
binding = "KV_LIMITER"
# To deploy this in your Cloudflare account, run: npx wrangler kv:namespace create KV_LIMITER
# and replace the id below with the generated ID:
id = "916a6d603bc7470586b217fb9bcb3297"
